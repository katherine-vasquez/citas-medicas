name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/citas-backend
  NOTIFICATIONS_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/citas-notifications

jobs:
  test:
    name: Instalar dependencias y probar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Validar el esquema de Prisma
        working-directory: backend
        run: npx prisma validate
        env:
          DATABASE_URL: mysql://user:pass@localhost:3306/ci

      - name: Verificar sintaxis
        run: |
          cd backend && npm run lint
          cd ../notifications && npm test

      - name: Ejecutar pruebas automatizadas
        working-directory: backend
        run: npm test

  build-and-push:
    name: Construir y publicar imagenes en Docker Hub
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Calcular etiquetas (version y commit)
        id: tags
        run: |
          echo "sha=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./backend/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.sha }}

      - name: Construir y publicar imagen de notificaciones
        uses: docker/build-push-action@v6
        with:
          context: ./notifications
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.NOTIFICATIONS_IMAGE }}:latest
            ${{ env.NOTIFICATIONS_IMAGE }}:${{ steps.tags.outputs.version }}
            ${{ env.NOTIFICATIONS_IMAGE }}:${{ steps.tags.outputs.sha }}
